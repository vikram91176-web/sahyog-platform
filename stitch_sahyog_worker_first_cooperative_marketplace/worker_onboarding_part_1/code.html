<!-- Step 1: Personal Info -->

</div>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface mb-2">Preferred Language</label>

<label class="flex items-center gap-3 p-4 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container transition-colors has-[:checked]:bg-primary-container has-[:checked]:text-on-primary-container has-[:checked]:border-primary-container">

<span class="material-symbols-outlined text-lg">carpenter</span>
<span class="text-label-sm font-label-sm">Carpentry</span>
</label>
<label class="flex items-center gap-2 p-3 border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container transition-colors has-[:checked]:bg-primary-container has-[:checked]:text-on-primary-container has-[:checked]:border-primary-container">
<input class="w-5 h-5 text-primary rounded focus:ring-primary border-outline-variant" type="checkbox">

<span class="text-label-sm font-label-sm">Delivery</span>

<span class="">Next Step</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>

<script>
        let currentStep = 1;
        const totalSteps = 3;
        const stepNames = ["Personal Info", "Location Selection", "Skills & Experience"];

        function updateUI() {
            // Hide all steps
            document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));
            // Show current step
            document.getElementById(`step-${currentStep}`).classList.add('active');
            
            // Update Progress Bar
            const progressPercentage = (currentStep / totalSteps) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercentage}%`;
            
            // Update Label
            document.getElementById('step-label').textContent = `Step ${currentStep} of ${totalSteps}`;
            document.getElementById('step-label').nextElementSibling.textContent = stepNames[currentStep-1];

            // Update Button Text
            const nextBtn = document.getElementById('next-btn');
            if (currentStep === totalSteps) {
                nextBtn.innerHTML = `<span>Complete Registration</span><span class="material-symbols-outlined">check_circle</span>`;
                nextBtn.classList.remove('bg-primary');
                nextBtn.classList.add('bg-secondary', 'text-on-secondary');
            } else {
                nextBtn.innerHTML = `<span>Next Step</span><span class="material-symbols-outlined">arrow_forward</span>`;
                nextBtn.classList.add('bg-primary');
                nextBtn.classList.remove('bg-secondary', 'text-on-secondary');
            }
        }

        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateUI();
            } else {
                alert("Registration Complete!");
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                updateUI();
            } else {
                console.log("Back to landing page");
            }
        }
    </script>
